name: release

# Check out, build, sign, and publish from the private source repository tlyboy/snoozeyoulose-app to this repository's (public) Releases.
# The public repository can use organization-level Apple signing secrets; electron-updater can also download updates from public releases without a token.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的源码 ref（分支或 tag）'
        default: main

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Token for this (public) repository, used to publish releases to this repository
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Organization-level Apple signing secrets (available to public repositories)
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: tlyboy/snoozeyoulose-app
          ref: ${{ github.event.inputs.ref || 'main' }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Import Apple Developer Certificate
        if: matrix.os == 'macos-latest'
        run: |
          # Secret values are not masked in the run's shell environment (unlike in if expressions), so this is a reliable way to check whether a certificate is available
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE 未注入，macOS 将产出未签名构建。"
            exit 0
          fi
          echo "APPLE_CERTIFICATE present (length ${#APPLE_CERTIFICATE})"
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import $RUNNER_TEMP/certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # For diagnostics only; do not set CSC_NAME (a prefixed value causes an error); let electron-builder select the certificate automatically based on CSC_LINK
          security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" || true
          echo "CSC_LINK=$RUNNER_TEMP/certificate.p12" >> $GITHUB_ENV
          echo "CSC_KEY_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> $GITHUB_ENV

      - name: Build & publish (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pnpm exec tsc
          pnpm exec vite build
          # electron-builder 26: mac.notarize must be a boolean; teamId is provided by the APPLE_TEAM_ID environment variable
          if [ -n "$APPLE_TEAM_ID" ]; then
            pnpm exec electron-builder --mac --publish always --config.mac.notarize=true
          else
            pnpm exec electron-builder --mac --publish always
          fi

      - name: Build & publish (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pnpm exec tsc
          pnpm exec vite build
          pnpm exec electron-builder --win --publish always

      - name: Build & publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm exec tsc
          pnpm exec vite build
          pnpm exec electron-builder --linux --publish always
